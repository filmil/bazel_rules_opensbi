# Publishing to the Bazel Central Registry is deliberately NOT wired into
# `Tag and Release`, and is started by hand.
#
# The `integration` module that BCR presubmit builds depends on
# `bazel_dep(name = "opensbi", version = "1.6")`. BCR resolves a module's
# dependencies from BCR, and `opensbi` is published only to
# filmil/bazel-registry, as an overlay entry over the pristine upstream
# tarball. A registry pull request for `rules_opensbi` therefore cannot pass
# presubmit until `opensbi` is published to BCR as well.
#
# Chaining this into the release would open a pull request that fails, on
# every release, against a public registry. Wire it up once `opensbi` is in
# BCR; until then dispatch this workflow only when that has changed.
#
# Based on the instructions at https://github.com/bazel-contrib/publish-to-bcr
name: "Publish on Bazel Central Registry"

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: filmil/bazel-central-registry
      attest: true
      # A draft entry is not reviewed, and BCR's stale
      # bot closes it after 44 days.
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
