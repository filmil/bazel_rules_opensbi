# Based on the instructions at https://github.com/bazel-contrib/publish-to-bcr
name: "Publish to my Bazel registry"

on:
  workflow_call:
    secrets:
      BCR_PUBLISH_TOKEN:
        required: false
        description: 'Optional token for registry publishing.'
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      # The personal overlay registry the PR is opened against.
      registry: filmil/bazel-registry
      # The fork of `registry`. It can be the same repo.
      registry_fork: filmil/bazel-registry
      # Only one publish workflow may attest, and it is the BCR one. Two
      # attesting publishes upload MODULE.bazel.intoto.jsonl and
      # source.json.intoto.jsonl to the release under those fixed names and
      # overwrite each other, leaving the entry written first naming hashes
      # the release no longer serves. BCR verifies attestations at presubmit
      # and this registry does not, so BCR is the one that keeps them.
      attest: false
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
